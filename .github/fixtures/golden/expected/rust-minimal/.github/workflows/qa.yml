name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Language and toolchain setup. Substituted by /init-project from the
      # chosen language profile's ci_setup_steps: the right `uses: ...` /
      # `run: ...` steps for this project's toolchain.
      - name: Set up Rust
        # Installs the toolchain pinned in rust-toolchain.toml (channel + the
        # clippy/rustfmt components) and enables cargo caching. rustflags is
        # cleared so the scripts alone define strictness (qa runs clippy with
        # -D warnings); the action would otherwise export RUSTFLAGS="-D warnings"
        # and make plain builds stricter in CI than locally.
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
      - name: Fetch dependencies
        run: cargo fetch

      - name: Run quality gate (lint, format, types, unit + functional)
        run: bash scripts/qa.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Same language/toolchain setup as the qa job.
      - name: Set up Rust
        # Installs the toolchain pinned in rust-toolchain.toml (channel + the
        # clippy/rustfmt components) and enables cargo caching. rustflags is
        # cleared so the scripts alone define strictness (qa runs clippy with
        # -D warnings); the action would otherwise export RUSTFLAGS="-D warnings"
        # and make plain builds stricter in CI than locally.
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
      - name: Fetch dependencies
        run: cargo fetch

      # no browser needed for this project's e2e suite

      - name: Run end-to-end suite
        run: bash scripts/e2e.sh

  # Feature-list check (AGENTS.md <hard-rules>): schema + every done feature
  # cites an existing test file. Agent-neutral plain script.
  features-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate the feature list
        run: python3 scripts/features_check.py

  # Doc budgets (AGENTS.md <context>): THIS JOB OWNS EVERY FILE CAP; prose
  # points here. scripts/prune.py deletes what a closed feature leaves behind
  # and owns the entry cap, so a file cap is the backstop. Over cap -> delete
  # whole stale entries; never rewrite one (a rewrite can flip an owed
  # obligation into a done claim). Raise a cap only once the file holds no
  # history, with a `# raised: <reason>` comment on the line.
  docs-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Enforce doc budgets (context economy)
        run: |
          set -e
          check() { f="$1"; cap="$2"; [ -f "$f" ] || return 0
            size=$(wc -c < "$f")
            if [ "$size" -gt "$cap" ]; then
              echo "::error::$f is ${size} bytes (cap ${cap}) -- delete what is stale, do not shave to just under the cap"
              exit 1; fi }
          # The only always-loaded file. The renderer enforces the same number.
          check AGENTS.md 8000
          check docs/SECURITY.md 14000
          check docs/gotchas.md 8000
          # A plan is the largest thing a fresh session loads for one feature.
          for plan in docs/plans/*.md; do
            [ "$(basename "$plan")" = "README.md" ] && continue
            check "$plan" 8000
          done
          # A budgeted doc CHANGED in this PR must land clear of its cap;
          # untouched files are not punished for history.
          near() { f="$1"; cap="$2"; [ -f "$f" ] || return 0
            git diff --quiet "$BASE" -- "$f" 2>/dev/null && return 0
            size=$(wc -c < "$f"); limit=$((cap * 95 / 100))
            if [ "$size" -gt "$limit" ]; then
              echo "::error::$f changed in this PR and lands at ${size}/${cap} chars -- within 5% of the cap is shaving, not compacting"
              exit 1; fi }
          BASE="$(git merge-base HEAD origin/main 2>/dev/null || echo HEAD~1)"
          near docs/SECURITY.md 14000
          near docs/gotchas.md 8000
          echo "docs-budget: OK"

      # Entry-level teeth (scripts/prune.py owns the entry cap) plus anything a
      # merge should have pruned: a closed feature's plan, losing mockups,
      # uncited probes. The fix is `python3 scripts/prune.py`, not prose work.
      - name: Entry shapes + leftovers a merge should have pruned
        run: python3 scripts/prune.py --check

  # Checkpoint budget (AGENTS.md <context>): what a fresh session must read to
  # resume ONE feature. THIS JOB OWNS THE NUMBER. It is a floor: CI sees repo
  # files only; global CLAUDE.md files, the memory index and enabled plugins
  # load on top -- `scripts/skills_doctor.py` prints that machine-side rest.
  checkpoint-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: A fresh session must be able to afford to start
        run: |
          set -e
          chars=0
          add() { [ -f "$1" ] || return 0; chars=$((chars + $(wc -c < "$1"))); }
          add AGENTS.md
          add .claude/skills/iteration/SKILL.md
          # the largest plan and the largest feature entry: the worst case a
          # restart actually faces
          largest=0
          for plan in docs/plans/*.md; do
            [ -f "$plan" ] || continue
            [ "$(basename "$plan")" = "README.md" ] && continue
            s=$(wc -c < "$plan"); [ "$s" -gt "$largest" ] && largest=$s
          done
          chars=$((chars + largest))
          ids=$(python3 -c "import json,sys; sys.stdout.write(' '.join(f['id'] for f in json.load(open('docs/features.json'))['features']))")
          entry=0
          for id in $ids; do
            s=$(python3 scripts/feature.py "$id" | wc -c)
            [ "$s" -gt "$entry" ] && entry=$s
          done
          chars=$((chars + entry))
          tokens=$((chars / 4))
          echo "checkpoint: ${chars} chars ~= ${tokens} tokens"
          if [ "$tokens" -gt 8000 ]; then
            echo "::error::a fresh session costs ~${tokens} tokens to re-prime (cap 8000). The usual cause: a plan that narrates instead of deciding."
            exit 1; fi
          echo "checkpoint-budget: OK"

  # Resume check: would `go` work right now? Asserts the pointers a fresh
  # session reads (the in-progress entry's phase, its plan, the branch) agree.
  resume-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: A fresh session has exactly one place to start
        run: python3 scripts/resume.py --check

  # Duplication gate (the iteration skill's GREEN step): the same 6-line
  # block in two files is copied logic, copied markup, or the same paragraph of
  # justification restated in five docstrings. Exceptions go in .dup-ignore.
  dup-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Duplication gate
        run: python3 scripts/dup_check.py

  # Test-tamper guard: a changed test or gate needs a `test-change:` reason
  # (AGENTS.md <hard-rules>). A pull request compares with its base branch;
  # a push, including a direct push to main, with the commit it started from.
  test-tamper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Test-tamper guard
        env:
          TAMPER_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 scripts/tamper_check.py
